services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - internal_net
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal_net

networks:
  internal_net:

volumes:
  db_data:
