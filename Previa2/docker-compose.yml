services:

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "${NGINX_PORT}:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - frontend
      - observability


networks:

  frontend:
    driver: bridge

  observability:
    driver: bridge
    internal: true